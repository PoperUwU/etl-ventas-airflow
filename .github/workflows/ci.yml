name: CI

# Corre en cada push a main y en cada pull request hacia main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Python que la imagen de Airflow que usamos en Docker
      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Las constraints fijan las mismas versiones de librerías que usa Docker
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt --constraint constraints-3.12.txt

      - name: Ejecutar pruebas
        run: pytest -v